
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Sanjay</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background:
            radial-gradient(circle at top, #ffeb3b 0%, #ff9800 20%, #ff4081 45%, #7c4dff 70%, #111 100%);
        font-family: 'Comic Sans MS', cursive, sans-serif;
        height: 100vh;
        width: 100vw;
        cursor: crosshair;
    }

    .milk-splash {
        position: absolute;
        opacity: 0.22;
        pointer-events: none;
        animation: drift 20s linear infinite;
        filter: blur(1px);
    }

    @keyframes drift {
        from { transform: translateY(0px) rotate(0deg); }
        to { transform: translateY(-60px) rotate(360deg); }
    }

    .title-zone {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .cereal-cloud {
        position: absolute;
        width: 800px;
        height: 400px;
        pointer-events: none;
        z-index: -1;
    }

    .save-box {
        position: relative;
        padding: 18px 40px;
        border-radius: 40px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 40px rgba(255,255,255,0.3);
    }

    .save-text {
        font-size: clamp(52px, 10vw, 120px);
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-align: center;
        color: white;
        text-shadow:
            0 0 8px #ff1744,
            4px 4px 0 #ff9800,
            -4px -4px 0 #00e5ff,
            0 0 25px rgba(255,255,255,0.9);
        transform: rotate(-2deg);
    }

    .subtitle {
        color: white;
        margin-top: 10px;
        font-size: 18px;
        text-shadow: 2px 2px 4px black;
        animation: wobble 2s infinite alternate;
    }

    @keyframes wobble {
        from { transform: rotate(-2deg); }
        to { transform: rotate(2deg); }
    }

    .sanjay-img {
        width: min(420px, 80vw);
        border-radius: 30px;
        border: 10px solid white;
        box-shadow:
            0 0 30px rgba(255,255,255,0.7),
            0 0 60px rgba(255,0,128,0.6);
        transform: rotate(-1.5deg);
        transition: transform 0.3s ease;
    }

    .sanjay-img:hover {
        transform: scale(1.05) rotate(2deg);
    }

    .loop {
        position: absolute;
        border-radius: 50%;
        pointer-events: auto;
        cursor: grab;
        transition: transform 0.2s;
        box-shadow: inset 0 0 6px rgba(255,255,255,0.7);
    }

    .loop:hover {
        transform: scale(1.5);
    }

    .message {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 20px;
        text-shadow: 2px 2px 5px black;
        z-index: 20;
    }

    .chaos-btn {
        margin-top: 12px;
        background: white;
        color: #ff1744;
        border: none;
        padding: 12px 20px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
        transition: 0.2s;
    }

    .chaos-btn:hover {
        transform: scale(1.08) rotate(-2deg);
    }

    .popup {
        position: absolute;
        color: white;
        font-size: 24px;
        font-weight: bold;
        pointer-events: none;
        animation: pop 1s forwards;
        text-shadow: 2px 2px 4px black;
    }

    @keyframes pop {
        0% {
            opacity: 1;
            transform: translateY(0px) scale(1);
        }
        100% {
            opacity: 0;
            transform: translateY(-60px) scale(2);
        }
    }
</style>
</head>

<script>
const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#00b0ff",
    "#d500f9",
    "#ff9100"
];

const sounds = [
    "CRONCH",
    "SPLASH",
    "LOOP'D",
    "CEREALIZED",
    "MILK ATTACK",
    "FRUIT MAXXING"
];

const loops = [];
const totalLoops = 180;

function createLoop(x = null, y = null, dense = false) {
    const loop = document.createElement("div");
    loop.classList.add("loop");

    const size = dense
        ? Math.random() * 22 + 10
        : Math.random() * 30 + 15;

    loop.style.width = size + "px";
    loop.style.height = size + "px";
    loop.style.border = "7px solid " +
        colors[Math.floor(Math.random()*colors.length)];

    loop.style.left = (x ?? Math.random() * window.innerWidth) + "px";
    loop.style.top = (y ?? Math.random() * window.innerHeight) + "px";

    document.body.appendChild(loop);

    const velocity = {
        x: (Math.random() - 0.5) * 3,
        y: (Math.random() - 0.5) * 3
    };

    let dragging = false;

    loop.addEventListener("mousedown", () => {
        dragging = true;
        loop.style.cursor = "grabbing";
    });

    window.addEventListener("mouseup", () => {
        dragging = false;
        loop.style.cursor = "grab";
    });

    window.addEventListener("mousemove", e => {
        if (dragging) {
            loop.style.left = e.clientX + "px";
            loop.style.top = e.clientY + "px";
        }
    });

    loop.addEventListener("click", (e) => {
        explode(loop);
        popText(
            sounds[Math.floor(Math.random()*sounds.length)],
            e.clientX,
            e.clientY
        );
    });

    loops.push({ el: loop, velocity });
}

function explode(loop) {
    for(let i = 0; i < 8; i++) {
        const mini = document.createElement("div");
        mini.classList.add("loop");

        const size = Math.random() * 10 + 5;
        mini.style.width = size + "px";
        mini.style.height = size + "px";
        mini.style.border = "4px solid " +
            colors[Math.floor(Math.random()*colors.length)];

        mini.style.left = loop.style.left;
        mini.style.top = loop.style.top;

        document.body.appendChild(mini);

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;

        let x = parseFloat(loop.style.left);
        let y = parseFloat(loop.style.top);

        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        const interval = setInterval(() => {
            x += vx;
            y += vy;

            mini.style.left = x + "px";
            mini.style.top = y + "px";
            mini.style.opacity -= 0.03;

            if (mini.style.opacity <= 0) {
                clearInterval(interval);
                mini.remove();
            }
        }, 16);
    }
}

function popText(text, x, y) {
    const popup = document.createElement("div");
    popup.classList.add("popup");
    popup.innerText = text;
    popup.style.left = x + "px";
    popup.style.top = y + "px";
    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 1000);
}

function animate() {
    loops.forEach(obj => {
        const el = obj.el;

        if (el.matches(":active")) return;

        let x = parseFloat(el.style.left);
        let y = parseFloat(el.style.top);

        x += obj.velocity.x;
        y += obj.velocity.y;

        const mouseForce = window.mousePos
            ? Math.hypot(
                window.mousePos.x - x,
                window.mousePos.y - y
              )
            : 9999;

        if(mouseForce < 120) {
            obj.velocity.x += (x - window.mousePos.x) * 0.001;
            obj.velocity.y += (y - window.mousePos.y) * 0.001;
        }

        if (x <= 0 || x >= window.innerWidth - 40)
            obj.velocity.x *= -1;

        if (y <= 0 || y >= window.innerHeight - 40)
            obj.velocity.y *= -1;

        el.style.left = x + "px";
        el.style.top = y + "px";
    });

    requestAnimationFrame(animate);
}

window.addEventListener("mousemove", e => {
    window.mousePos = { x: e.clientX, y: e.clientY };
});

for(let i = 0; i < totalLoops; i++) {
    createLoop();
}

// ultra dense cloud behind title
const cloud = document.getElementById("cerealCloud");
for(let i = 0; i < 120; i++) {
    createLoop(
        window.innerWidth / 2 + (Math.random()-0.5)*500,
        window.innerHeight / 2 - 120 + (Math.random()-0.5)*250,
        true
    );
}

function spawnChaos() {
    for(let i = 0; i < 40; i++) {
        createLoop(
            Math.random()*window.innerWidth,
            Math.random()*window.innerHeight
        );
    }

    document.body.style.transform =
        "rotate(" + (Math.random()*2-1) + "deg)";

    setTimeout(() => {
        document.body.style.transform = "rotate(0deg)";
    }, 300);

    popText("MAXIMUM CRUNCH", window.innerWidth/2, 120);
}

animate();
